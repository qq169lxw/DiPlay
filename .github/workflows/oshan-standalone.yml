name: Oshan standalone build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch official authentication assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diplay-auth/runtime-assets/offline-mfi"
          curl -L -o "$RUNNER_TEMP/official.apk" "https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.22/DiPlay-0.2.22.apk"
          echo "7d04db263834f22010a86847766928113d3503a273e4d2d3440d21552e173139  $RUNNER_TEMP/official.apk" | sha256sum -c -
          unzip -j "$RUNNER_TEMP/official.apk" "assets/offline-mfi/identity.pk8" "assets/offline-mfi/certificate.p7b" -d "$RUNNER_TEMP/diplay-auth/runtime-assets/offline-mfi"
          ls -l "$RUNNER_TEMP/diplay-auth/runtime-assets/offline-mfi"
          test -s "$RUNNER_TEMP/diplay-auth/runtime-assets/offline-mfi/identity.pk8"
          test -s "$RUNNER_TEMP/diplay-auth/runtime-assets/offline-mfi/certificate.p7b"
      - name: Standalone debug build
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/diplay-auth/runtime-assets
        run: ./gradlew :mobile:assembleStandaloneDebug --stacktrace
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Oshan-standalone
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
